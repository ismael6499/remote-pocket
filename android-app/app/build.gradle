plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remotepocket'
    compileSdk 34

    defaultConfig {
        applicationId "com.remotepocket"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        appSign {
            storeFile file("keystore.jks")
            storePassword "remotepocket"
            keyAlias "remotepocket"
            keyPassword "remotepocket"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appSign
        }
        release {
            signingConfig signingConfigs.appSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def mobileDropDir = new File(System.getProperty("user.home"), "Documents/Mobile Drop")
        if (mobileDropDir.exists()) {
            def copyTask = tasks.register("copy${variant.name.capitalize()}ToMobileDrop", Copy) {
                from output.outputFile
                into mobileDropDir
                rename { String fileName -> "RemotePocket-v${variant.versionName}.apk" }
                doLast {
                    def genericFile = new File(mobileDropDir, "RemotePocket.apk")
                    def source = new File(mobileDropDir, "RemotePocket-v${variant.versionName}.apk")
                    if (source.exists()) {
                        java.nio.file.Files.copy(source.toPath(), genericFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
            variant.assembleProvider.get().finalizedBy(copyTask)
        }
    }
}
