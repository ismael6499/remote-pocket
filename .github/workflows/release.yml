name: Build & Release RemotePocket APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "release-output/RemotePocket-${TAG_NAME}.apk"

      - name: Prepare PC Agent Zip Artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p pc-agent-package
          cp -r pc-agent/* pc-agent-package/
          rm -rf pc-agent-package/node_modules pc-agent-package/updates pc-agent-package/logs pc-agent-package/*.log pc-agent-package/*.exe
          cd pc-agent-package
          zip -r "../release-output/RemotePocket-PC-Agent-${TAG_NAME}.zip" .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: RemotePocket ${{ github.ref_name }}
          files: |
            release-output/*.apk
            release-output/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
